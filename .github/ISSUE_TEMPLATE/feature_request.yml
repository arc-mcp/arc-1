name: 💡 Feature request
description: Suggest a new capability, a new object type / tool action, or an improvement to existing behavior.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the idea! Please [search existing issues](https://github.com/arc-mcp/arc-1/issues?q=is%3Aissue) first — many requests are already tracked."

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues (open and closed) and this isn't already requested.
          required: true
        - label: I checked the [roadmap](https://github.com/arc-mcp/arc-1/blob/main/docs_page/roadmap.md) and the [design principles](https://github.com/arc-mcp/arc-1/blob/main/AGENTS.md#design-principles). Core does not install ABAP on the system, call RFC, execute ABAP, or act through a shared SAP identity; those belong in an extension.
          required: true
        - label: This is one request. (Several ideas? Please file one issue each.)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's blocking you today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should ARC-1 do? If it's a tool change, name the tool, the action, and the object type.
      placeholder: "e.g. SAPWrite should support creating table types (TTYP) and writing function-group includes."
    validations:
      required: true

  - type: textarea
    id: sap-api
    attributes:
      label: Which SAP API would serve this?
      description: "The ADT endpoint or other existing SAP API (Eclipse ADT doing the same thing is a good sign), and the release where you saw it work. Requests without a usable SAP API are the ones most often declined. Write \"unknown\" if you don't know."
      placeholder: "e.g. /sap/bc/adt/ddic/tabletypes, used by Eclipse ADT on 758 SP02 / unknown"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Your environment
      description: ARC-1 version, SAP_BASIS release with SP level, and how ARC-1 is deployed.
      placeholder: "e.g. 1.8.0, 758 SP02, BTP Cloud Foundry with principal propagation"
    validations:
      required: false

  - type: dropdown
    id: pr-plan
    attributes:
      label: Do you plan to open a PR for this?
      description: If yes, please wait for a maintainer reply on scope before writing code — a new tool action, object type, config option or auth path is agreed here first. See CONTRIBUTING.md.
      options:
        - "No"
        - "Yes, after the scope is agreed here"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select all that apply.
      multiple: true
      options:
        - SAPRead
        - SAPSearch
        - SAPWrite
        - SAPActivate
        - SAPNavigate
        - SAPQuery
        - SAPTransport
        - SAPGit
        - SAPContext
        - SAPLint
        - SAPDiagnose
        - SAPManage
        - Connection / auth / deployment
        - Caching / performance
        - Documentation
        - Other
    validations:
      required: false

  - type: input
    id: area-other
    attributes:
      label: Other area — please specify
      description: Only if you selected "Other" above.
    validations:
      required: false

  - type: input
    id: release
    attributes:
      label: Release-specific?
      description: If this only applies to certain SAP releases, which ones?
      placeholder: "e.g. only 8.16+, or NW 7.50"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / workarounds
      description: Anything you've tried, or other tools that already do this (e.g. fr0ster/mcp-abap-adt).
    validations:
      required: false
