name: 🐞 Bug report
description: A tool call fails, returns wrong data, or a connection / auth problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! 🙏

        A few seconds of context saves a round-trip. The most useful things are your **SAP release**, the **exact tool call** you made, and the **exact error / HTTP status** you got back.

        Before filing, please skim the [documentation](https://docs.arc-1-mcp.com/) ([quickstart](https://docs.arc-1-mcp.com/quickstart/) · [tool reference](https://docs.arc-1-mcp.com/tools/)) and [search existing issues](https://github.com/arc-mcp/arc-1/issues?q=is%3Aissue).

  - type: markdown
    attributes:
      value: |
        <details><summary>🤖 <b>Using an AI assistant (Claude, Copilot, Cursor, …)? Let it fill this out for you — click to expand.</b></summary>

        ARC-1 runs through an assistant, so the assistant that hit the problem already has the exact tool call and error in context. Paste the prompt below to it, then drop its answer into the fields here.

        ```text
        I hit a problem using ARC-1 (the SAP ADT MCP server). Help me file a precise bug report.

        1. Summarize the problem in 2–3 sentences: what I asked for, what ARC-1 actually did, and what I expected.
        2. Recover from THIS session, verbatim — do not paraphrase or invent:
           - the exact failing tool call: tool name, action, and full JSON arguments
           - the exact response/error: message, HTTP status code, and ADT URL if present
        3. Determine what you can about the environment; write "unknown" for anything you can't (do NOT guess):
           ARC-1 version, SAP system type, SAP_BASIS release, how ARC-1 is deployed, which MCP client this is, the ABAP object type involved.
        4. Sanity-check first, and tell me the result instead of guessing:
           - Report ONE problem. If there are several, write one report each.
           - State the exact ARC-1 version (never "latest") and whether the problem still occurs on the latest release.
           - If you can, repeat the same call with `arc1-cli call`, or try the same operation in Eclipse ADT with the
             same user. A failure in only one MCP client is usually that client's problem, not ARC-1's.
        5. Then output the filled-in fields below, ready for me to paste into the GitHub bug form:

        Version:
        SAP system:
        SAP_BASIS release:
        Deployment:
        MCP client:
        Tool(s):
        Object type:
        Where it fails (ARC-1 refuses before SAP / SAP HTTP error / wrong result / connection or login):
        What happened:
        Steps to reproduce (the exact call):
        Expected:
        Error / HTTP status / ADT response:
        Cross-check (arc1-cli call, another client, Eclipse ADT):
        ```
        </details>

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I searched [existing issues](https://github.com/arc-mcp/arc-1/issues?q=is%3Aissue) (open and closed) and this isn't a duplicate.
          required: true
        - label: I checked the [documentation](https://docs.arc-1-mcp.com/) (quickstart, tool reference, configuration).
          required: false
        - label: This report is about one problem. (Several problems? Please file one issue each — bundled reports get closed half-solved.)
          required: true

  - type: markdown
    attributes:
      value: "### Environment"

  - type: input
    id: version
    attributes:
      label: ARC-1 version
      description: "The exact number, not \"latest\": run `arc1-cli --version`, or check the installed `arc-1` package version / Docker image tag. If you can, reproduce on the latest release first — several reports were already fixed there."
      placeholder: "e.g. 0.9.17"
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: SAP system
      description: Which kind of SAP backend are you connecting to?
      options:
        - SAP S/4HANA (on-premise or private cloud)
        - SAP S/4HANA Cloud Public Edition
        - SAP BTP ABAP Environment (Steampunk / embedded)
        - SAP NetWeaver AS ABAP (7.0x – 7.5x)
        - SAP ERP / ECC
        - Other / not sure
    validations:
      required: true

  - type: input
    id: sap-basis
    attributes:
      label: SAP_BASIS release
      description: "ARC-1 gates tools and behavior by release, so this matters a lot. Find it via System → Status in SAP GUI (component SAP_BASIS), or in ARC-1's startup log (the feature probe prints the detected release)."
      placeholder: "e.g. 758 SP02, 750 SP25, 816, or 'ECC EHP8 / 740 SP20' — include the SP level"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running ARC-1?
      options:
        - Local — npx / npm (stdio)
        - Docker (ghcr.io/arc-mcp/arc-1)
        - SAP BTP Cloud Foundry
        - Self-hosted HTTP Streamable server
        - Other
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      description: Which assistant / client is calling ARC-1?
      options:
        - Claude Desktop
        - Claude Code
        - VS Code (GitHub Copilot / Continue / Cline)
        - Cursor
        - Eclipse (GitHub Copilot)
        - Microsoft Copilot Studio
        - Gemini CLI
        - Windsurf
        - Codex
        - Kilo Code
        - Kiro
        - Antigravity
        - Other / N/A
    validations:
      required: false

  - type: dropdown
    id: auth
    attributes:
      label: Authentication mode
      options:
        - Basic (SAP_USER / SAP_PASSWORD)
        - API key
        - XSUAA OAuth (BTP)
        - OIDC / Entra ID
        - BTP Destination + Principal Propagation
        - Cookies
        - Not sure
    validations:
      required: false

  - type: input
    id: environment-details
    attributes:
      label: Other environment details
      description: "Anything that applies: operating system, database (HANA, Oracle, …), and on BTP the destination type, whether ARC-1 and the SAP system are in the same subaccount, Cloud Connector, and principal propagation or a shared user."
      placeholder: "e.g. Windows 11; BTP CF, PrincipalPropagation destination via Cloud Connector, same subaccount"
    validations:
      required: false

  - type: markdown
    attributes:
      value: "### What went wrong"

  - type: dropdown
    id: fails-where
    attributes:
      label: Where does it fail?
      options:
        - ARC-1 refuses the call before contacting SAP (validation, safety, lint)
        - SAP answers with an HTTP error
        - The call succeeds but the result is wrong or incomplete
        - Connection, login or OAuth (before any tool call)
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Which ARC-1 tool(s)?
      description: Select all that apply.
      multiple: true
      options:
        - SAPRead
        - SAPSearch
        - SAPWrite
        - SAPActivate
        - SAPNavigate
        - SAPQuery
        - SAPTransport
        - SAPGit
        - SAPContext
        - SAPLint
        - SAPDiagnose
        - SAPManage
        - Not sure / not tool-specific (connection, setup, auth)
    validations:
      required: false

  - type: input
    id: object-type
    attributes:
      label: ABAP object type(s) involved
      description: If the bug is about a specific object kind.
      placeholder: "e.g. TABL, TTYP (table type), FUGR include, DTEL, CLAS, DDLS"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: "SAPWrite create of a table type (TTYP) returns ... / the function-group include is never written ..."
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: "Include the **exact** tool call — the `arc1-cli call …` command, or the JSON arguments your client sent. This is the single most helpful thing you can provide."
      placeholder: |
        1. ...
        2. Call the tool, e.g.:
           {
             "action": "create",
             "type": "TTYP",
             "name": "ZTT_DEMO",
             "package": "$TMP"
           }
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "The table type should be created and activate cleanly."
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Exact error / HTTP status / ADT response
      description: "Copy the full message verbatim, including the HTTP status code and ADT URL if present (e.g. `status 423 at /sap/bc/adt/...`). Write \"none\" if the call succeeded with a wrong result."
    validations:
      required: true

  - type: input
    id: cross-check
    attributes:
      label: Cross-check
      description: "Does the same call work with `arc1-cli call`, from another MCP client, or as the same operation in Eclipse ADT with the same user? This separates ARC-1 bugs from client, setup and SAP-side causes."
      placeholder: "e.g. fails in Eclipse Copilot, works with arc1-cli call / not checked"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs & relevant configuration
      description: "Set `ARC1_LOG_HTTP_DEBUG=true` for full ADT request/response logging. Paste relevant env vars (e.g. `SAP_ALLOW_WRITES`, `SAP_ALLOWED_PACKAGES`, `SAP_LANGUAGE`, `SAP_SYSTEM_TYPE`, `ARC1_TOOL_MODE`). ⚠️ Redact `SAP_PASSWORD`, API keys, service keys, and cookies."
      render: shell
    validations:
      required: false

  - type: dropdown
    id: pr-plan
    attributes:
      label: Do you plan to open a PR for this?
      description: Welcome. For anything beyond a small fix, please wait for a maintainer reply on the approach first — see CONTRIBUTING.md.
      options:
        - "No"
        - "Yes"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        💡 Many "write doesn't work" reports turn out to be configuration: ARC-1 is **read-only by default** and only allows the `$TMP` package until you set `SAP_ALLOW_WRITES=true` and add your package to `SAP_ALLOWED_PACKAGES`. See the [configuration reference](https://docs.arc-1-mcp.com/).
