name: Secret scan

# Catch hardcoded credentials before they land on main. This is defense-in-depth,
# NOT the primary control: GitHub native secret scanning + push protection (free on
# this public repo — enable in Settings → Code security) block a secret server-side
# at push time regardless of branch protection, and are the real preventive layer.
# This job adds an auditable SARIF trail + a PR check, and — once added as a REQUIRED
# status check (main is not a protected branch today) — blocks merges on a finding.
#
# Tool: Trivy filesystem secret scanner, reusing the exact action SHA already vetted
# for the image-CVE gate (security-scan.yml). gitleaks-action needs a paid
# GITLEAKS_LICENSE for organization accounts (arc-mcp is an org); Trivy has no such
# gate. Coverage is structured credentials (API keys, tokens, cloud keys, PEM private
# keys) — rationale, coverage boundary, and the TruffleHog upgrade path are in
# docs/security-model.md §8. False positive? Add a line to a root .trivyignore.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Trivy uploads SARIF findings to the Security tab.
  security-events: write

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # exit-code 1 fails the job on ANY secret finding; --format sarif still writes
      # the report first (verified: exit 1 AND SARIF emitted on a planted secret).
      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          exit-code: '1'

      # Record findings in the Security tab. if: always() so a real finding is still
      # uploaded even though the scan step just failed the job. Skipped on fork PRs:
      # their GITHUB_TOKEN is downgraded to read-only, so the upload would 403 and
      # false-fail an otherwise-clean external PR — the scan+gate above still runs on
      # forks via exit-code, it just can't write to the Security tab.
      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets
