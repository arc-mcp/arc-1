name: Dependency evidence

on:
  schedule:
    - cron: '37 6 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    name: Source dependency evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Use a known npm version
        run: npm install --global --ignore-scripts npm@11.11.1
      # This workflow is a maintenance signal, never a required PR or release gate.
      - name: Collect lockfile evidence without installing dependencies
        run: npm run security:evidence -- --out reports/security/current --require-clean --fail-on-high
      - name: Publish readable summary
        if: always()
        run: |
          if [ -f reports/security/current/summary.md ]; then
            cat reports/security/current/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Evidence unavailable. Inspect the failed collection step; this is not a clean scan.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain evidence and incomplete results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/security/current/
          if-no-files-found: error
          retention-days: 30
