# Temporary research workflow on this branch only; do not merge this workflow into main.
name: SAP 1057 retained-failure diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.repository }}-sap-live-a4h
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the original assertion with bounded failure diagnostics
        run: npx vitest run --config vitest.integration.config.ts tests/integration/where-used-diagnosis.integration.test.ts
        env:
          TEST_SAP_URL: ${{ secrets.TEST_SAP_URL }}
          TEST_SAP_USER: ${{ secrets.TEST_SAP_USER }}
          TEST_SAP_PASSWORD: ${{ secrets.TEST_SAP_PASSWORD }}
          TEST_SAP_CLIENT: ${{ secrets.TEST_SAP_CLIENT }}
          TEST_SAP_INSECURE: ${{ secrets.TEST_SAP_INSECURE }}
          TEST_FILE_PARALLELISM: 'false'
      - name: Retain the original failure and bounded follow-up evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: where-used-retained-failure-diagnosis
          path: |
            test-results/integration.json
            /tmp/arc1-1057-native-original-*.json
            /tmp/arc1-1057-native-followup-*.json
          retention-days: 14
          if-no-files-found: warn
