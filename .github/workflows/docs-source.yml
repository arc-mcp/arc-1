name: Validate Documentation Source Index

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt
      - name: Test documentation provenance and generated index (no cloud credentials)
        run: python3 -m unittest discover -s scripts/docs/tests -v
