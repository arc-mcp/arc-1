name: Security scan (scheduled)

# Proactively catch base-image + dependency CVEs before a release.
#
# release.yml reports HIGH/CRITICAL Trivy findings without blocking Docker publication.
# This scheduled job remains gating so a newly disclosed issue still produces a red
# maintenance signal and SARIF alerts independently of the release path.
#
# Every CI image build bypasses the named runtime-stage cache, so `apk upgrade`
# actually consults Alpine's current repository instead of restoring an old package
# layer from the shared GHA cache.

on:
  schedule:
    # 06:17 UTC Mon/Wed/Fri. Off-the-hour minute dodges top-of-hour scheduler
    # congestion (delayed/dropped runs). 3×/week balances lead time vs. CI noise.
    - cron: '17 6 * * 1,3,5'
  workflow_dispatch:

# Scheduled runs always use the default branch's copy of this file, so it only
# takes effect once merged to main.
permissions:
  contents: read
  # Trivy uploads SARIF findings to the Security tab.
  security-events: write

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  trivy-release-gate-preview:
    name: scheduled gate (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            image: arc-1:scan-amd64
            sarif_category: trivy-scheduled
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: arc-1:scan-arm64
            sarif_category: trivy-scheduled-linux-arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      # Build each release architecture locally (load into the daemon, no push).
      # Reuses the expensive builder cache but always refreshes the runtime stage.
      - name: Build image for scan
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.image }}
          pull: true
          no-cache-filters: runtime
          cache-from: type=gha,scope=${{ github.repository }}-${{ matrix.platform }}

      - name: Verify runtime packages and native addon
        run: |
          docker run --rm --platform "${{ matrix.platform }}" "${{ matrix.image }}" \
            sh -c 'apk info -v libcrypto3 libssl3 && node -e "require(\"better-sqlite3\")"'

      # Scheduled readiness gate: HIGH,CRITICAL + limit-severities-for-sarif so the
      # exit-code honors the severity filter (without it, format=sarif evaluates
      # exit-code across ALL severities and fires on MEDIUM/LOW too).
      - name: Scan image with Trivy (scheduled gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always() && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          # Keep the historical amd64 category so a clean main scan closes #48/#49.
          category: ${{ matrix.sarif_category }}
