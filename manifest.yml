---
# Cloud Foundry deployment manifest for ARC-1 MCP server on SAP BTP.
#
# This is the shipped on-premise TEMPLATE. Copy it to a deployment-specific
# filename such as manifest-onprem.yml before customizing it. For BTP ABAP
# Environment (direct OAuth), start from the shipped manifest-btp-abap.yml.
#
# Credentials are NOT stored here. Set ARC1_API_KEYS via `cf set-env`; separate
# API-key and strict PP instances are recommended, while mixed mode is supported.
#
# See docs_page/deployment-best-practices.md for architecture guidance.
# See docs_page/btp-cloud-foundry-deployment.md for step-by-step BTP deployment.

# ──────────────────────────────────────────────────────────────────────
# Example: On-Premise SAP via Cloud Connector + Principal Propagation
# ──────────────────────────────────────────────────────────────────────
applications:
  - name: arc1-mcp-server
    docker:
      image: ghcr.io/arc-mcp/arc-1:latest
    instances: 1
    memory: 256M
    disk_quota: 512M
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      # SAP connection (URL must match Cloud Connector virtual host mapping)
      SAP_URL: "http://a4h-abap:50000"
      SAP_CLIENT: "001"
      SAP_LANGUAGE: "EN"
      SAP_INSECURE: "false"
      # System type (auto-detects, or set explicitly)
      SAP_SYSTEM_TYPE: "auto"
      # MCP transport (CF sets PORT env var automatically)
      SAP_TRANSPORT: "http-streamable"
      # BTP Destination Service (reads credentials from destination config)
      SAP_BTP_DESTINATION: "SAP_TRIAL"
      # Principal Propagation (per-user SAP auth)
      # SAP_BTP_PP_DESTINATION: "SAP_TRIAL_PP"
      # SAP_PP_ENABLED: "true"
      # SAP_PP_STRICT: "true"
      # XSUAA auth for MCP-native clients (Claude Desktop, Cursor, etc.)
      # SAP_XSUAA_AUTH: "true"
      # Authorization / safety: safe defaults
      SAP_ALLOW_WRITES: "false"
      SAP_ALLOW_DATA_PREVIEW: "false"
      SAP_ALLOW_FREE_SQL: "false"
      SAP_ALLOW_TRANSPORT_WRITES: "false"
      SAP_ALLOW_GIT_WRITES: "false"
      # Experimental read-only UI. Keep disabled unless explicitly testing it.
      ARC1_UI: "off"
      # CORS — only set if a browser UI calls /mcp directly. Native MCP clients
      # (Claude Desktop, Cursor, VS Code Copilot, Copilot Studio) don't need this.
      # Comma-separated, exact match, no wildcards.
      # ARC1_ALLOWED_ORIGINS: "https://your-ui.example.com"
      # Logging
      SAP_VERBOSE: "true"
      # Experimental destination-discovered multi-target is intentionally not
      # configured in this generic single-target manifest. Use the reviewed MTA
      # profile in docs_page/multi-target-setup.md; it also creates XSUAA role
      # collections and documents the required Basic one-process/non-rolling
      # operator procedure. A descriptor cannot prevent process overlap.
    services:
      - arc1-connectivity
      - arc1-destination
      # - arc1-xsuaa       # Required for experimental multi-target; optional otherwise
      # - arc1-auditlog    # Uncomment for BTP Audit Log
