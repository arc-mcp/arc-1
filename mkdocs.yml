site_name: ARC-1 — SAP ADT MCP Server
site_description: Connect AI assistants to SAP ABAP. Set up ARC-1, choose permissions, and find tool, deployment, and operations guides.
site_url: https://docs.arc-1-mcp.com/
repo_url: https://github.com/arc-mcp/arc-1
repo_name: arc-mcp/arc-1
edit_uri: edit/main/docs_page/

docs_dir: docs_page

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  palette:
    # `media` = follow the OS light/dark setting on first visit; the toggle then pins a choice.
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started:
      - quickstart.md
      - install-in-claude.md
      - agent-plugin.md
  - Use ARC-1:
      - mcp-usage.md
      - Skills:
          - skills.md
          - skills-vscode.md
          - skills-eclipse.md
      - cli-guide.md
      - live-relations.md
  - Deploy:
      - deployment.md
      - docker.md
      - SAP BTP:
          - btp-overview.md
          - btp-cloud-foundry-deployment.md
          - btp-archive-inspection.md
          - btp-setup-worksheet.md
          - btp-abap-environment.md
          - btp-abap-prerequisites.md
          - s4hana-public-cloud.md
          - multi-target-setup.md
      - deployment-best-practices.md
  - Access and security:
      - enterprise-auth.md
      - authorization.md
      - xsuaa-setup.md
      - principal-propagation-setup.md
      - btp-destination-setup.md
      - api-key-setup.md
      - oauth-jwt-setup.md
      - security-guide.md
      - sap-api-policy-and-architecture.md
  - Operate:
      - operations.md
      - btp-administration.md
      - multi-target-administration.md
      - updating.md
      - log-analysis.md
      - rate-limiting.md
      - caching.md
      - auth-test-process.md
  - Reference:
      - configuration-reference.md
      - configuration-precedence.md
      - Tools:
          - tools.md
          - tools/sap-read.md
          - tools/sap-search.md
          - tools/sap-write.md
          - tools/sap-activate.md
          - tools/sap-navigate.md
          - tools/sap-query.md
          - tools/sap-transport.md
          - tools/sap-git.md
          - tools/sap-context.md
          - tools/sap-lint.md
          - tools/sap-diagnose.md
          - tools/sap-manage.md
          - tools/sap-targets.md
          - tools/write-function-modules.md
          - tools/write-class-members.md
          - tools/write-text-elements.md
      - extensions.md
  - Develop:
      - local-development.md
      - architecture.md
      - sap-trial-setup.md
  - Project:
      - release-notes.md
      - roadmap.md
      - arc-1-vs-sap-abap-mcp-server.md
      - blog-series.md
      - newsletter.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        multi-destination.md: multi-target-setup.md
        multi-system-hub.md: btp-overview.md
        phase4-btp-deployment.md: btp-cloud-foundry-deployment.md

extra_javascript:
  - javascripts/posthog.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arc-mcp/arc-1
