site_name: ARC-1 — SAP ADT MCP Server
site_description: Connect AI assistants to SAP ABAP. Set up ARC-1, choose permissions, and find tool, deployment, and operations guides.
site_url: https://docs.arc-1-mcp.com/
repo_url: https://github.com/arc-mcp/arc-1
repo_name: arc-mcp/arc-1
edit_uri: edit/main/docs_page/

docs_dir: docs_page

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

theme:
  name: material
  custom_dir: overrides
  palette:
    # `media` = follow the OS light/dark setting on first visit; the toggle then pins a choice.
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - Install in Claude: install-in-claude.md
      - Agent plugin: agent-plugin.md
  - Use ARC-1:
      - Workflows and prompts: mcp-usage.md
      - Skills:
          - Install and choose skills: skills.md
          - GitHub Copilot in VS Code: skills-vscode.md
          - GitHub Copilot in Eclipse: skills-eclipse.md
      - CLI: cli-guide.md
      - Live relations (experimental): live-relations.md
  - Deploy:
      - Choose a deployment: deployment.md
      - Docker: docker.md
      - SAP BTP:
          - Choose a setup: btp-overview.md
          - Cloud Foundry deployment: btp-cloud-foundry-deployment.md
          - Inspect the deployment archive: btp-archive-inspection.md
          - Setup worksheet: btp-setup-worksheet.md
          - BTP ABAP environment: btp-abap-environment.md
          - BTP ABAP prerequisites: btp-abap-prerequisites.md
          - S/4HANA Public Cloud: s4hana-public-cloud.md
          - Multi-target setup (experimental): multi-target-setup.md
      - Deployment practices: deployment-best-practices.md
  - Access and security:
      - Authentication: enterprise-auth.md
      - Permissions and roles: authorization.md
      - XSUAA: xsuaa-setup.md
      - Principal propagation: principal-propagation-setup.md
      - BTP destinations: btp-destination-setup.md
      - API keys: api-key-setup.md
      - OAuth and JWT: oauth-jwt-setup.md
      - Security checklist: security-guide.md
      - SAP API policy: sap-api-policy-and-architecture.md
  - Operate:
      - Find an operation: operations.md
      - BTP administration: btp-administration.md
      - Multi-target administration: multi-target-administration.md
      - Update ARC-1: updating.md
      - Logs and troubleshooting: log-analysis.md
      - Rate limits: rate-limiting.md
      - Caching: caching.md
      - Test authentication: auth-test-process.md
  - Reference:
      - Configuration: configuration-reference.md
      - Configuration precedence: configuration-precedence.md
      - Tools:
          - Choose a tool: tools.md
          - SAPRead: tools/sap-read.md
          - SAPSearch: tools/sap-search.md
          - SAPWrite: tools/sap-write.md
          - SAPActivate: tools/sap-activate.md
          - SAPNavigate: tools/sap-navigate.md
          - SAPQuery: tools/sap-query.md
          - SAPTransport: tools/sap-transport.md
          - SAPGit: tools/sap-git.md
          - SAPContext: tools/sap-context.md
          - SAPLint: tools/sap-lint.md
          - SAPDiagnose: tools/sap-diagnose.md
          - SAPManage: tools/sap-manage.md
          - SAPTargets: tools/sap-targets.md
          - Function module writes: tools/write-function-modules.md
          - Class member edits: tools/write-class-members.md
          - Text element edits: tools/write-text-elements.md
      - Custom tool extensions: extensions.md
  - Develop:
      - Run locally and from source: local-development.md
      - Architecture: architecture.md
      - SAP test system: sap-trial-setup.md
  - Project:
      - Release notes: release-notes.md
      - Roadmap: roadmap.md
      - Compare with SAP ADT MCP: arc-1-vs-sap-abap-mcp-server.md
      - Blog articles: blog-series.md
      - Newsletter: newsletter.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        multi-destination.md: multi-target-setup.md
        multi-system-hub.md: btp-overview.md
        phase4-btp-deployment.md: btp-cloud-foundry-deployment.md

extra_javascript:
  - javascripts/posthog.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arc-mcp/arc-1
