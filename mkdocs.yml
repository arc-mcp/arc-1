site_name: ARC-1 — SAP ADT MCP Server
site_description: Enterprise-ready MCP proxy for SAP ABAP Development Tools. npm package + Docker image, admin safety controls, works with Claude, Copilot, and all MCP clients.
site_url: https://docs.arc-1-mcp.com/
repo_url: https://github.com/arc-mcp/arc-1
repo_name: arc-mcp/arc-1
edit_uri: edit/main/docs_page/

docs_dir: docs_page

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # `media` = follow the OS light/dark setting on first visit; the toggle then pins a choice.
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github

nav:
  - Get Started:
      - Home: index.md
      - Quickstart: quickstart.md
      - Install in Claude: install-in-claude.md
  - Deploy:
      - Choose a Deployment: deployment.md
      - Docker: docker.md
      - SAP BTP:
          - Start Here: btp-overview.md
          - Cloud Foundry Deployment: btp-cloud-foundry-deployment.md
          - SAP Backends:
              - BTP ABAP Environment: btp-abap-environment.md
              - S/4HANA Public Cloud: s4hana-public-cloud.md
          - Multi-System:
              - Multi-Target Setup: multi-target-setup.md
      - Multi-System Hub (mcp-hub): multi-system-hub.md
      - Deployment Best Practices: deployment-best-practices.md
  - Security:
      - Authentication Overview: enterprise-auth.md
      - Authorization & Roles: authorization.md
      - Production Security: security-guide.md
      - MCP Authentication:
          - XSUAA: xsuaa-setup.md
          - OAuth / JWT: oauth-jwt-setup.md
          - API Keys: api-key-setup.md
      - SAP Identity & Connectivity:
          - BTP Destination Reference: btp-destination-setup.md
          - Principal Propagation: principal-propagation-setup.md
  - Use ARC-1:
      - MCP Usage Guide: mcp-usage.md
      - Tools Reference: tools.md
      - Skills: skills.md
      - Extensions (Custom Tools): extensions.md
      - CLI Guide: cli-guide.md
      - Blog Series: blog-series.md
  - Operate:
      - Operations Overview: operations.md
      - SAP BTP:
          - BTP Administration: btp-administration.md
          - Multi-Target Administration: multi-target-administration.md
      - Updating: updating.md
      - Log Analysis: log-analysis.md
      - Rate Limiting: rate-limiting.md
      - Caching: caching.md
      - Authentication Test Process: auth-test-process.md
  - Reference:
      - Configuration Reference: configuration-reference.md
      - Configuration Precedence: configuration-precedence.md
      - vs SAP ABAP MCP Server: arc-1-vs-sap-abap-mcp-server.md
  - Develop:
      - Local Development: local-development.md
      - Architecture: architecture.md
      - SAP Trial Setup: sap-trial-setup.md
      - Roadmap: roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        multi-destination.md: multi-target-setup.md
        phase4-btp-deployment.md: btp-cloud-foundry-deployment.md

extra_javascript:
  - javascripts/posthog.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/arc-mcp/arc-1
